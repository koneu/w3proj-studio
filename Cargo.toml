[workspace]
resolver = "2"
members = ["crates/mpq", "crates/casc", "crates/w3proj", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
mpq = { path = "crates/mpq" }
casc = { path = "crates/casc" }
w3proj = { path = "crates/w3proj" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
flate2 = "1"
bzip2 = "0.6"
explode = "0.1"

[profile.dev.package."*"]
opt-level = 2

# Index/encoding parsing is hot even in debug builds.
[profile.dev.package.casc]
opt-level = 2
