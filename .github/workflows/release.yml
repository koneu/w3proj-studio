# Release packages, started by hand (Actions → Release → Run workflow): the app's installers for Windows
# (NSIS, MSI) and Linux (AppImage, deb), each with the `w3proj` CLI next to the app (the MCP bridge looks for it
# there), plus the bare CLI binaries. Everything is uploaded as workflow artifacts; with "draft release" set,
# they are also attached to a new draft release, which stays unpublished until someone publishes it.
# Nothing is signed. The same build locally: README "Build & run".
name: Release

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Also attach the packages to a new draft release
        type: boolean
        default: false
      tag:
        description: Tag for the draft release (default v<version> from tauri.conf.json); created at this commit when it doesn't exist
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis,msi
          # The oldest supported Ubuntu: the AppImage and deb link against its glibc and run on newer systems too.
          - os: ubuntu-22.04
            platform: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # The same packages scripts/setup-linux.sh installs on a developer machine.
      - name: System packages
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          read -ra packages <<< "$(scripts/setup-linux.sh --apt-packages)"
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App dependencies
        working-directory: app
        run: npm ci

      # Version comes from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: CLI
        run: cargo build --release --locked -p w3proj-cli

      # Tauri bundles an external binary from src-tauri/binaries/<name>-<target triple> and installs it as <name>
      # next to the app's own program (tauri.release.conf.json).
      - name: CLI into the bundle
        run: |
          exe=""; [[ "${{ matrix.platform }}" == windows ]] && exe=".exe"
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p app/src-tauri/binaries
          cp "target/release/w3proj$exe" "app/src-tauri/binaries/w3proj-$triple$exe"

      - name: App bundles
        working-directory: app
        run: npx tauri build --ci --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Collect
        run: |
          exe=""; [[ "${{ matrix.platform }}" == windows ]] && exe=".exe"
          mkdir -p out
          cp "target/release/w3proj$exe" "out/w3proj-${{ matrix.platform }}-x86_64$exe"
          # The app's code `w3proj rebuild` runs in Node: next to the w3proj program it is found (the same file on every platform).
          node app/scripts/headless.mjs --out out/w3proj-headless.mjs
          shopt -s nullglob
          for f in target/release/bundle/{nsis/*.exe,msi/*.msi,appimage/*.AppImage,deb/*.deb}; do cp "$f" out/; done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: w3proj-studio-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  draft-release:
    if: inputs.draft_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            TAG="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "W3Proj Studio $TAG" --generate-notes out/*
