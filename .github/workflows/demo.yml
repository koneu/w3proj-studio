# Builds the web demo (docs/web-demo.md: the UI with made-up sample content, no Tauri, no game data) and deploys it
# to GitHub Pages at https://koneu.github.io/w3proj-studio/. It needs Pages enabled once in the repository's
# settings (Settings > Pages > Source: GitHub Actions); until then the deploy job fails and nothing else is affected.
name: Web demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: App dependencies
        working-directory: app
        run: npm ci
      - name: Build the demo
        working-directory: app
        run: npm run build:demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
